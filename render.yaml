services:
  - type: web
    name: thokar-taller
    runtime: docker
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_TOKEN
        sync: false
      - key: BOOSTR_API_KEY
        sync: false
      - key: BOOSTR_TIMEOUT_MS
        value: 12000
      - key: PLATE_REQUESTS_PER_10_SECONDS
        value: 4
