services:
  - type: web
    name: thokar-taller
    runtime: docker
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_TOKEN
        sync: false
      - key: BOOSTR_API_KEY
        sync: false
      - key: RESTART_TIMEOUT_MS
        value: 12000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: BOOSTR_TIMEOUT_MS
        value: 12000
      - key: PLATE_REQUESTS_PER_MINUTE
        value: 12
      - key: AI_REQUESTS_PER_MINUTE
        value: 30
      - key: PLATE_CACHE_MS
        value: 21600000
